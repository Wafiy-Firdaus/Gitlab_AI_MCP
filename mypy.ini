[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
explicit_package_bases = True
exclude = .git|__pycache__|.pytest_cache

# The GitLab client wraps httpx response.json() which returns Any.
# We suppress no-any-return for this module since JSON APIs are inherently dynamic.
[mypy-gitlab.client]
warn_return_any = False

# Tool modules delegate to the client; same reasoning applies for passthrough returns.
[mypy-tools.*]
warn_return_any = False

# Server bootstraps the MCP framework; dynamic return types are expected.
[mypy-server]
warn_return_any = False
