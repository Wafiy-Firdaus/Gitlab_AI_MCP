[project]
name = "gitlab-ai-mcp"
version = "0.3.0"
description = "Docker-first GitLab MCP server with repository, review, and CI/CD tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
]
dependencies = [
    "mcp[cli]>=1.2.1",
    "httpx[http2]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "rich>=13.7.0",
]

[project.scripts]
gitlab-ai-mcp = "server:main"

[tool.uv]
managed = true
dev-dependencies = [
    "ruff>=0.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["gitlab", "services", "tools", "server.py", "config.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ASYNC"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
