services:
  gitlab-ai-mcp:
    build: .
    container_name: gitlab-ai-mcp
    restart: always
    env_file: .env
    environment:
      - LOCAL_AI_URL=http://ollama:11434
    command: ["sleep", "infinity"]
    stdin_open: true
    tty: true
    volumes:
      - .:/app

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: gitlab-ai-ollama
    restart: always
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Pulls the default model on first run
  ollama-pull:
    profiles: [ollama]
    image: curlimages/curl:latest
    container_name: gitlab-ai-ollama-pull
    depends_on:
      - ollama
    entrypoint: [ "sh", "-c", "sleep 5 && curl http://ollama:11434/api/pull -d '{\"name\": \"llama3.1:8b\"}'" ]

volumes:
  ollama_data:
